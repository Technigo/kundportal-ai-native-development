<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kundserviceportalen</title>
    <style>
      /* ===== DELAT SKELETT: grundstil. Del 3 och Del 4 lägger egen CSS under sina markeringar längst ner. ===== */
      :root {
        --bg: #f3f5f7;
        --surface: #ffffff;
        --text: #1b2733;
        --muted: #5b6b79;
        --border: #d3dae0;
        --accent: #1d5fa8;
        --error: #b42318;
        --ok: #1a7f4b;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--text);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        line-height: 1.5;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 2rem;
        padding: 0.75rem 1.5rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .topbar h1 {
        margin: 0;
        font-size: 1.15rem;
      }
      nav {
        display: flex;
        gap: 0.5rem;
      }
      nav button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      nav button[aria-current='page'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (max-width: 40rem) {
        .topbar {
          flex-wrap: wrap;
          gap: 0.75rem;
          padding: 0.75rem 1rem;
        }
        nav {
          flex-wrap: wrap;
        }
        nav button {
          white-space: nowrap;
        }
      }
      main {
        max-width: 60rem;
        margin: 1.5rem auto;
        padding: 0 1.5rem;
      }
      section[data-view] {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
      }
      section[data-view][hidden] {
        display: none;
      }
      h2 {
        margin-top: 0;
        font-size: 1.1rem;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .field-error {
        display: block;
        min-height: 1.25rem;
        color: var(--error);
        font-size: 0.9rem;
      }
      [aria-invalid='true'] {
        border-color: var(--error);
      }
      #global-message {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--error);
        background: #fdecea;
        color: var(--error);
      }
      #global-message[data-kind='ok'] {
        border-color: var(--ok);
        background: #e8f5ee;
        color: var(--ok);
      }
      #global-message[hidden] {
        display: none;
      }
      .placeholder {
        margin: 0;
        padding: 1rem;
        border: 2px dashed var(--border);
        border-radius: 6px;
        color: var(--muted);
      }

      /* ===== DEL 3 – CSS för registreringsformuläret: lägg till här ===== */
      #new-case-form {
        max-width: 32rem;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.75rem;
      }
      .form-row label {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .form-row input,
      .form-row select,
      .form-row textarea {
        font: inherit;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .submit-btn {
        font: inherit;
        padding: 0.5rem 1.2rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      /* ===== DEL 4 – CSS för lista, detalj, status och redigering: lägg till här ===== */
      .case-table-wrap {
        overflow-x: hidden;
      }
      .case-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      .case-table th,
      .case-table td {
        text-align: left;
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      .case-table th {
        font-weight: 600;
        color: var(--muted);
      }
      .case-table th[data-field='arendenummer'],
      .case-table td[data-field='arendenummer'] {
        width: 18%;
      }
      .case-table th[data-field='prioritet'],
      .case-table td[data-field='prioritet'] {
        width: 12%;
      }
      .case-table th[data-field='status'],
      .case-table td[data-field='status'] {
        width: 18%;
      }
      .case-table th[data-field='deadline'],
      .case-table td[data-field='deadline'] {
        width: 18%;
      }
      .case-clip {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .case-table td[data-field='rubrik'] .case-clip {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .case-list-empty {
        margin: 0;
        color: var(--muted);
      }
      .case-row {
        cursor: pointer;
      }
      .case-row:hover {
        background: #f7f9fb;
      }
      .case-row:focus,
      .case-row.is-focused {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      .case-row:focus td,
      .case-row.is-focused td {
        background: #e7f0fa;
      }
      @media (max-width: 40rem) {
        #view-list {
          padding: 1rem 1rem 0.35rem;
        }
        .case-table,
        .case-table tbody,
        .case-table tr,
        .case-table td {
          display: block;
          width: auto;
        }
        .case-table thead {
          display: none;
        }
        .case-table th[data-field],
        .case-table td[data-field] {
          width: auto;
        }
        .case-table tr.case-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-areas:
            'rubrik rubrik'
            'nummer status'
            'prio deadline';
          column-gap: 0.75rem;
          row-gap: 0.15rem;
          margin: 0.2rem 0.15rem;
          padding: 0.8rem 0.9rem;
          border: 0;
          border-bottom: 1px solid var(--border);
          border-radius: 0;
        }
        .case-table tr.case-row:last-child {
          border-bottom: 0;
        }
        .case-table tr.case-row:hover {
          background: #f7f9fb;
          border-radius: 8px;
        }
        .case-row:focus td,
        .case-row.is-focused td {
          background: transparent;
        }
        .case-row:focus,
        .case-row.is-focused {
          background: #e7f0fa;
          border-radius: 8px;
        }
        .case-table td {
          border: 0;
          padding: 0;
          min-width: 0;
        }
        .case-table td::before {
          content: none;
        }
        .case-table td[data-field='rubrik'] {
          grid-area: rubrik;
          color: var(--text);
          font-weight: 600;
          font-size: 1rem;
          line-height: 1.35;
        }
        .case-table td[data-field='arendenummer'] {
          grid-area: nummer;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td[data-field='status'] {
          grid-area: status;
          justify-self: end;
          align-self: center;
        }
        .case-table td[data-field='status'] .case-clip {
          display: inline-block;
          padding: 0.08rem 0.5rem;
          border-radius: 999px;
          background: #e8eef5;
          color: var(--text);
          font-size: 0.75rem;
          font-weight: 600;
          line-height: 1.45;
        }
        .case-table td[data-field='prioritet'] {
          grid-area: prio;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td[data-field='prioritet']::before {
          content: 'Prio ';
        }
        .case-table td[data-field='deadline'] {
          grid-area: deadline;
          justify-self: end;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td .case-clip {
          display: inline;
          min-width: 0;
          overflow: visible;
          overflow-wrap: normal;
          -webkit-line-clamp: unset;
          line-clamp: unset;
        }
        .case-table td[data-field='rubrik'] .case-clip {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          overflow: hidden;
        }
      }
      @media (min-width: 40.0625rem) and (max-width: 52rem) {
        .case-table th,
        .case-table td {
          padding: 0.5rem 0.45rem;
          overflow: hidden;
        }
        .case-table th {
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        .case-table th[data-field='arendenummer'],
        .case-table td[data-field='arendenummer'] {
          width: 9.25rem;
        }
        .case-table th[data-field='prioritet'],
        .case-table td[data-field='prioritet'] {
          width: 4.75rem;
        }
        .case-table th[data-field='status'],
        .case-table td[data-field='status'] {
          width: 6.5rem;
        }
        .case-table th[data-field='deadline'],
        .case-table td[data-field='deadline'] {
          width: 6.75rem;
        }
      }
      html.detail-open,
      body.detail-open {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #view-detail:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0.75rem;
        border: 0;
        border-radius: 0;
        background: rgba(27, 39, 51, 0.45);
        overflow: hidden;
      }
      .detail-dialog {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: min(40rem, 100%);
        max-height: 100%;
        min-height: 0;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
        box-shadow: 0 12px 40px rgba(27, 39, 51, 0.18);
      }
      .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        flex: 0 0 auto;
      }
      .detail-close {
        flex: 0 0 auto;
        width: 2.75rem;
        height: 2.75rem;
        margin: -0.4rem -0.4rem 0 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      .detail-close:hover {
        background: #f7f9fb;
      }
      .detail-body {
        min-height: 0;
        /* Luft så att fokusringen runt dropdownen inte klipps av scrollytan. */
        margin-left: -0.5rem;
        margin-right: -0.5rem;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .detail-fields {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin: 0;
        min-width: 0;
      }
      .detail-text,
      .detail-status-block {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .detail-fields dt {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
      }
      .detail-fields dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .detail-status,
      .detail-error {
        margin: 0;
      }
      .detail-error {
        color: var(--error);
      }
      .detail-message {
        flex: 0 0 auto;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--error);
        background: #fdecea;
        color: var(--error);
      }
      .detail-message[data-kind='ok'] {
        border-color: var(--ok);
        background: #e8f5ee;
        color: var(--ok);
      }
      .detail-message[hidden] {
        display: none;
      }
      .detail-status-form {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .detail-status-form select,
      .detail-edit-form select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 2rem 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--surface);
        /* Egen nedåtpil av två gradienter, så att den följer --text och får jämnt avstånd till kanten. */
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text) 50%),
          linear-gradient(135deg, var(--text) 50%, transparent 50%);
        background-repeat: no-repeat;
        background-position:
          calc(100% - 1.5rem) 50%,
          calc(100% - 1rem) 50%;
        background-size: 0.5rem 0.5rem;
        color: var(--text);
        font: inherit;
      }
      .detail-footer {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }
      .detail-footer:empty {
        display: none;
      }
      .detail-status-submit {
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .detail-status-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .detail-edit-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
        margin: 0;
      }
      .detail-edit-field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .detail-edit-field label {
        color: var(--muted);
        font-weight: 600;
      }
      .detail-edit-form input,
      .detail-edit-form textarea {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        overflow-wrap: anywhere;
      }
      .detail-edit-submit {
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .detail-edit-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      @media (max-width: 40rem) {
        #view-detail:not([hidden]) {
          padding: 0.5rem;
        }
        .detail-dialog {
          padding: 1rem;
        }
        .detail-footer {
          flex-direction: column;
        }
        .detail-footer .detail-status-submit,
        .detail-footer .detail-edit-submit {
          width: 100%;
        }
      }
      
      /* ===== DESIGN – grönt tema och formulär i två kolumner (endast utseende) ===== */
      :root {
        --bg: #f1f7f4;
        --text: #12332a;
        --muted: #4f6e62;
        --border: #cfe3da;
        --accent: #0b6b4f;
      }
      .topbar {
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 18px rgba(11, 107, 79, 0.08);
      }
      .topbar h1 {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 800;
      }
      .topbar h1::before {
        content: '';
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 0.25rem 50% 50% 50%;
        background: var(--accent);
        animation: design-pop 0.6s ease both;
      }
      nav button {
        border-color: transparent;
        border-radius: 999px;
        background: transparent;
        font-weight: 600;
        transition: background 0.2s;
      }
      nav button:hover {
        background: #e2f1ea;
      }
      nav button[aria-current='page'] {
        background: var(--accent);
        border-color: var(--accent);
      }
      section[data-view] {
        border: 0;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(11, 107, 79, 0.1);
        animation: design-rise 0.5s ease both;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent);
      }
      .form-row input,
      .form-row select,
      .form-row textarea {
        border: 1.5px solid #a9cbbd;
        border-radius: 12px;
        background: #fafdfb;
      }
      .submit-btn {
        padding: 0.7rem 1.6rem;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(11, 107, 79, 0.3);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(11, 107, 79, 0.35);
      }
      .case-row:hover,
      .case-table tr.case-row:hover {
        background: #f1f7f4;
      }
      .case-row:focus td,
      .case-row.is-focused td {
        background: #dff0e8;
      }
      .case-row:focus,
      .case-row.is-focused {
        outline-color: var(--accent);
      }
      .detail-close:hover {
        background: #f1f7f4;
      }
      .case-row {
        animation: design-rise 0.45s ease both;
      }
      .case-row:nth-child(2) {
        animation-delay: 0.06s;
      }
      .case-row:nth-child(3) {
        animation-delay: 0.12s;
      }
      .case-row:nth-child(4) {
        animation-delay: 0.18s;
      }
      .case-row:nth-child(n + 5) {
        animation-delay: 0.24s;
      }
      @keyframes design-rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      @keyframes design-pop {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      /* Registrera nytt ärende: rubrik och beskrivning till vänster, valen till höger */
      @media (min-width: 48rem) {
        #new-case-form {
          max-width: none;
          display: grid;
          grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
          column-gap: 2rem;
        }
        #new-case-form .form-row:nth-child(1) {
          grid-column: 1;
          grid-row: 1;
        }
        #new-case-form .form-row:nth-child(2) {
          grid-column: 1;
          grid-row: 2 / span 3;
        }
        #new-case-form .form-row:nth-child(2) textarea {
          flex: 1;
          min-height: 10rem;
          resize: vertical;
        }
        #new-case-form .form-row:nth-child(3) {
          grid-column: 2;
          grid-row: 1;
        }
        #new-case-form .form-row:nth-child(4) {
          grid-column: 2;
          grid-row: 2;
        }
        #new-case-form .form-row:nth-child(5) {
          grid-column: 2;
          grid-row: 3;
        }
        #new-case-form .form-row:nth-child(6) {
          grid-column: 2;
          grid-row: 4;
        }
        #new-case-form .submit-btn {
          grid-column: 1 / -1;
          grid-row: 5;
          justify-self: start;
        }
      }
      
      /* ===== DESIGN – större text (lättare att läsa) ===== */
      html {
        font-size: 112.5%;
      }
      body {
        line-height: 1.6;
      }
      .field-error {
        font-size: 1rem;
      }
      .case-table {
        font-size: 1rem;
      }
      @media (max-width: 40rem) {
        .case-table td[data-field='nummer'],
        .case-table td[data-field='arendenummer'],
        .case-table td[data-field='prioritet'],
        .case-table td[data-field='deadline'] {
          font-size: 0.95rem;
        }
        .case-table td[data-field='status'] .case-clip {
          font-size: 0.85rem;
        }
      }
      @media (min-width: 40.0625rem) and (max-width: 52rem) {
        .case-table th[data-field='prioritet'],
        .case-table td[data-field='prioritet'] {
          width: 6rem;
        }
      }
            .field-hint {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Kundserviceportalen</h1>
      <nav aria-label="Huvudmeny">
        <button type="button" data-nav="list">Ärenden</button>
        <button type="button" data-nav="new">Nytt ärende</button>
      </nav>
    </header>

    <main>
      <div id="global-message" role="alert" hidden></div>

      <!-- ===== DEL 3: Registrera ärende (AK1–AK8) ===== -->
      <section id="view-new" data-view="new" aria-labelledby="h-new" hidden>
        <h2 id="h-new">Registrera nytt ärende</h2>

        <form id="new-case-form" novalidate>
          <div class="form-row">
            <label for="f-rubrik">Rubrik</label>
            <input id="f-rubrik" name="rubrik" type="text" />
            <span class="field-error" data-error-for="rubrik"></span>
          </div>
          <div class="form-row">
            <label for="f-beskrivning">Beskrivning</label>
            <textarea id="f-beskrivning" name="beskrivning" rows="5"></textarea>
            <span class="field-error" data-error-for="beskrivning"></span>
          </div>
          <div class="form-row">
            <label for="f-kategori">Kategori</label>
            <select id="f-kategori" name="kategori"></select>
            <span class="field-error" data-error-for="kategori"></span>
          </div>
          <div class="form-row">
            <label for="f-prioritet">Prioritet</label>
            <select id="f-prioritet" name="prioritet" aria-describedby="hint-prioritet"></select>
            <span class="field-hint" id="hint-prioritet">1 = lägst, 5 = högst</span>
            <span class="field-error" data-error-for="prioritet"></span>
          </div>
          <div class="form-row">
            <label for="f-status">Status</label>
            <select id="f-status" name="status"></select>
            <span class="field-error" data-error-for="status"></span>
          </div>
          <div class="form-row">
            <label for="f-deadline">Deadline</label>
            <input id="f-deadline" name="deadline" type="date" />
            <span class="field-error" data-error-for="deadline"></span>
          </div>
          <button type="submit" class="submit-btn">Registrera</button>
        </form>

        
        <!--
        Kontrakt för formuläret:
          - fältnamn (name=…): rubrik, beskrivning, kategori, prioritet, status, deadline
          - vid varje fält ett <span class="field-error" data-error-for="<fältnamn>"></span>
            som showFieldErrors() fyller med serverns meddelande
          - skicka med api('POST', '/api/arenden', data)
      --></section>

      <!-- ===== DEL 4: Lista (AK10) ===== -->
      <section id="view-list" data-view="list" aria-labelledby="h-list">
        <h2 id="h-list">Ärenden</h2>
        <div id="case-list"></div>
      </section>

      <!-- ===== DEL 4: Detalj, ändra status och redigera (AK11–AK16) ===== -->
      <section id="view-detail" data-view="detail" hidden>
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="h-detail">
          <div class="detail-header">
            <h2 id="h-detail">Ärende</h2>
            <button type="button" class="detail-close" aria-label="Stäng">×</button>
          </div>
          <p id="detail-message" class="detail-message" role="status" hidden></p>
          <div id="case-detail" class="detail-body"></div>
          <div id="detail-footer" class="detail-footer"></div>
        </div>
      </section>
    </main>

    <script>
      'use strict';

      /* ================================================================
       DELAT SKELETT – ändras bara via en liten, granskad PR.
       Funktioner som alla delar använder: api(), showView(), showFieldErrors(), formatCreatedAt().
       ================================================================ */

      // Samma värden som backend/src/constants.js. Risk: listorna kan glida isär –
      // ett test som jämför dem vore en bra liten uppgift.
      const PORTAL_CONFIG = Object.freeze({
        KATEGORIER: [
          'Anmälan och inskrivning',
          'Aktivitetsrapport',
          'Ersättning och stöd',
          'Jobb och sökning',
          'Utbildning och insatser',
          'Digital tjänst och inloggning',
          'Övrigt',
        ],
        STATUSAR: ['Nytt', 'Pågående', 'Väntar på kund', 'Avslutat'],
        PRIORITETER: [1, 2, 3, 4, 5],
        RUBRIK_MAX: 100,
        BESKRIVNING_MAX: 5000,
      });

      /**
       * Anropar backend. Kastar aldrig – fel kommer tillbaka som { ok:false, status, data }.
       * data.fel = allmänt meddelande, data.faltfel = { fältnamn: meddelande } (se docs/API.md).
       */
      async function api(method, path, body) {
        try {
          const res = await fetch(path, {
            method,
            headers: body === undefined ? undefined : { 'Content-Type': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          let data = null;
          try {
            data = await res.json();
          } catch {
            /* svaret var inte JSON */
          }
          return { ok: res.ok, status: res.status, data };
        } catch {
          return {
            ok: false,
            status: 0,
            data: {
              fel: 'Kunde inte nå servern. Kontrollera att den är igång.',
            },
          };
        }
      }

      function showView(name, arg) {
        document.querySelectorAll('[data-view]').forEach((el) => {
          el.hidden = el.dataset.view !== name;
        });
        document.querySelectorAll('[data-nav]').forEach((btn) => {
          // "detail" hör till menyvalet Ärenden
          const active = btn.dataset.nav === (name === 'detail' ? 'list' : name);
          if (active) btn.setAttribute('aria-current', 'page');
          else btn.removeAttribute('aria-current');
        });
        clearGlobalMessage();
        if (name === 'new') onShowNewView();
        if (name === 'list') onShowListView();
        if (name === 'detail') onShowDetailView(arg);
      }

      function showGlobalMessage(text, kind = 'error') {
        const el = document.getElementById('global-message');
        el.textContent = text;
        el.dataset.kind = kind;
        el.hidden = false;
      }
      function clearGlobalMessage() {
        const el = document.getElementById('global-message');
        el.hidden = true;
        el.textContent = '';
      }

      /** Skriver ut fältfel intill rätt fält: <span data-error-for="rubrik"> + aria-invalid på [name="rubrik"]. */
      function showFieldErrors(form, faltfel = {}) {
        clearFieldErrors(form);
        for (const [falt, meddelande] of Object.entries(faltfel)) {
          const out = form.querySelector(`[data-error-for="${falt}"]`);
          const input = form.querySelector(`[name="${falt}"]`);
          if (out) out.textContent = meddelande;
          if (input) input.setAttribute('aria-invalid', 'true');
        }
      }
      function clearFieldErrors(form) {
        form.querySelectorAll('[data-error-for]').forEach((el) => {
          el.textContent = '';
        });
        form.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
      }

      /** Visar skapad (ISO 8601, UTC) i svensk lokal tid, t.ex. 2026-11-03 11:00. */
      function formatCreatedAt(value) {
        if (value == null || value === '') return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat('sv-SE', {
          timeZone: 'Europe/Stockholm',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        }).format(date);
      }

      /* ================================================================
       DEL 3 – Registrera ärende (AK1–AK8)
       Ägare: se docs/ARBETSFORDELNING.md. Rör bara det här blocket.
       ================================================================ */

       function fillSelect(select, values) {
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Välj…";
        select.append(empty);
        for (const value of values) {
          const option = document.createElement("option");
          option.value = String(value);
          option.textContent = String(value);
          select.append(option);
        }
      }

      function initNewCaseView() {
        const form = document.getElementById("new-case-form");
        fillSelect(
          form.querySelector('[name="kategori"]'),
          PORTAL_CONFIG.KATEGORIER,
        );
        fillSelect(
          form.querySelector('[name="prioritet"]'),
          PORTAL_CONFIG.PRIORITETER,
        );
        fillSelect(
          form.querySelector('[name="status"]'),
          PORTAL_CONFIG.STATUSAR,
        );
        form.addEventListener("submit", onSubmitNewCase);
      }

      async function onSubmitNewCase(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        const value = (name) => form.querySelector(`[name="${name}"]`).value;

        // Allt skickas som användaren skrev det. Servern avgör vad som är giltigt.
        // Prioritet skickas som tal (docs/API.md), men ett tomt val skickas tomt.
        const data = {
          rubrik: value("rubrik"),
          beskrivning: value("beskrivning"),
          kategori: value("kategori"),
          prioritet: value("prioritet") === "" ? "" : Number(value("prioritet")),
          status: value("status"),
          deadline: value("deadline"),
        };

        clearGlobalMessage();
        button.disabled = true;
        const res = await api("POST", "/api/arenden", data);
        button.disabled = false;

        if (res.ok) {
          form.reset();
          clearFieldErrors(form);
          showGlobalMessage(
            `Ärende ${res.data.arendenummer} är registrerat.`,
            "ok",
          );
          return;
        }
        showFieldErrors(form, res.data?.faltfel);
        showGlobalMessage(res.data?.fel || "Något gick fel. Försök igen.");
      }

      function onShowNewView() {
        const form = document.getElementById("new-case-form");
        form.reset();
        clearFieldErrors(form);
      }

      /* ================================================================
       DEL 4 – Lista, detalj, status och redigering (AK10–AK16)
       Ägare: se docs/ARBETSFORDELNING.md. Rör bara det här blocket.
       ================================================================ */

      const LIST_FIELD_LABELS = {
        arendenummer: 'Ärendenummer',
        rubrik: 'Rubrik',
        beskrivning: 'Beskrivning',
        kategori: 'Kategori',
        prioritet: 'Prioritet',
        status: 'Status',
        skapad: 'Skapad',
        deadline: 'Deadline',
      };
      const DEFAULT_LIST_FIELDS = ['arendenummer', 'rubrik', 'prioritet', 'status', 'deadline'];
      const DETAIL_FIELDS = [
        'arendenummer',
        'rubrik',
        'beskrivning',
        'kategori',
        'prioritet',
        'status',
        'skapad',
        'deadline',
      ];

      let detailRequest = 0;
      let detailTrigger = null;

      /* ---------- Lista ---------- */

      function setDetailScrollLock(locked) {
        document.documentElement.classList.toggle('detail-open', locked);
        document.body.classList.toggle('detail-open', locked);
      }

      function focusCaseRow(row) {
        if (!row || !row.isConnected) return;
        document.querySelectorAll('#case-list .case-row.is-focused').forEach((el) => {
          if (el !== row) el.classList.remove('is-focused');
        });
        row.classList.add('is-focused');
        try {
          row.focus({ focusVisible: true });
        } catch {
          row.focus();
        }
      }

      function closeDetailView() {
        detailRequest += 1;
        const trigger = detailTrigger;
        detailTrigger = null;
        // Stäng-knappen försvinner vid musklick. Fokus sätts på raden innan dess,
        // och en gång till efteråt så att webbläsaren inte lämnar fokus på sidan.
        focusCaseRow(trigger);
        document.getElementById('view-detail').hidden = true;
        setDetailScrollLock(false);
        setTimeout(() => focusCaseRow(trigger), 0);
      }

      function openCaseFromRow(row) {
        detailTrigger = row;
        onShowDetailView(row.dataset.arendenummer);
      }

      function initCaseViews() {
        const list = document.getElementById('case-list');
        list.addEventListener('click', (event) => {
          const row = event.target.closest('tr[data-arendenummer]');
          if (!row) return;
          openCaseFromRow(row);
        });
        list.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          const row = event.target.closest('tr[data-arendenummer]');
          if (!row) return;
          event.preventDefault();
          openCaseFromRow(row);
        });
        list.addEventListener('focusin', (event) => {
          const row = event.target.closest('tr.case-row');
          if (!row) return;
          document.querySelectorAll('#case-list .case-row.is-focused').forEach((el) => {
            if (el !== row) el.classList.remove('is-focused');
          });
          row.classList.add('is-focused');
        });

        const detail = document.getElementById('view-detail');
        detail.addEventListener('click', (event) => {
          if (event.target.closest('.detail-dialog')) return;
          closeDetailView();
        });
        detail.querySelector('.detail-close').addEventListener('click', (event) => {
          event.stopPropagation();
          closeDetailView();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          if (detail.hidden) return;
          event.preventDefault();
          closeDetailView();
        });

        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => setDetailScrollLock(false));
        });
      }

      async function onShowListView() {
        setDetailScrollLock(false);

        const container = document.getElementById('case-list');
        container.replaceChildren();

        const res = await api('GET', '/api/arenden');
        if (!res.ok || !Array.isArray(res.data)) {
          showGlobalMessage(res.data?.fel || 'Kunde inte hämta ärenden.');
          return;
        }

        if (res.data.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'case-list-empty';
          empty.textContent = 'Inga ärenden ännu.';
          container.append(empty);
          return;
        }

        renderCaseTable(container, res.data, DEFAULT_LIST_FIELDS);
      }

      function renderCaseTable(container, cases, fields) {
        const wrap = document.createElement('div');
        wrap.className = 'case-table-wrap';
        const table = document.createElement('table');
        table.className = 'case-table';

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        for (const field of fields) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.dataset.field = field;
          th.textContent = LIST_FIELD_LABELS[field] || field;
          headRow.append(th);
        }
        thead.append(headRow);

        const tbody = document.createElement('tbody');
        for (const arende of cases) {
          const tr = document.createElement('tr');
          if (arende.arendenummer != null) {
            tr.dataset.arendenummer = String(arende.arendenummer);
            tr.classList.add('case-row');
            tr.tabIndex = 0;
          }
          for (const field of fields) {
            const td = document.createElement('td');
            const value = arende[field];
            const text = value == null ? '' : String(value);
            td.dataset.field = field;
            td.dataset.label = LIST_FIELD_LABELS[field] || field;
            const clip = document.createElement('span');
            clip.className = 'case-clip';
            clip.textContent = text;
            if (text) clip.title = text;
            td.append(clip);
            tr.append(td);
          }
          tbody.append(tr);
        }

        table.append(thead, tbody);
        wrap.append(table);
        container.append(wrap);
      }

      function updateListRow(arende) {
        if (arende?.arendenummer == null) return;
        const wanted = String(arende.arendenummer);
        const row = [...document.querySelectorAll('#case-list tr[data-arendenummer]')].find(
          (tr) => tr.dataset.arendenummer === wanted,
        );
        if (!row) return;
        for (const cell of row.querySelectorAll('td[data-field]')) {
          const clip = cell.querySelector('.case-clip');
          if (!clip) continue;
          const value = arende[cell.dataset.field];
          const text = value == null ? '' : String(value);
          clip.textContent = text;
          if (text) clip.title = text;
          else clip.removeAttribute('title');
        }
      }

      /* ---------- Detalj: meddelanden ---------- */

      function showDetailMessage(text, kind = 'error') {
        const el = document.getElementById('detail-message');
        el.textContent = text;
        el.dataset.kind = kind;
        el.hidden = false;
      }

      function clearDetailMessage() {
        const el = document.getElementById('detail-message');
        el.hidden = true;
        el.textContent = '';
        delete el.dataset.kind;
      }

      /* ---------- Detalj: statusbyte ---------- */

      function isCaseObject(data) {
        return data != null && typeof data === 'object' && !Array.isArray(data);
      }

      function changeStatus(arendenummer, status) {
        return api('PATCH', `/api/arenden/${encodeURIComponent(arendenummer)}/status`, { status });
      }

      function updateListStatus(arendenummer, status) {
        if (arendenummer == null) return;
        const wanted = String(arendenummer);
        const row = [...document.querySelectorAll('#case-list tr[data-arendenummer]')].find(
          (tr) => tr.dataset.arendenummer === wanted,
        );
        const clip = row?.querySelector('td[data-field="status"] .case-clip');
        if (!clip) return;
        const text = status == null ? '' : String(status);
        clip.textContent = text;
        if (text) clip.title = text;
        else clip.removeAttribute('title');
      }

      function createStatusForm(saved) {
        const form = document.createElement('form');
        form.id = 'detail-status-form';
        form.className = 'detail-status-form';

        const select = document.createElement('select');
        select.id = 'detail-status';
        select.name = 'status';
        select.setAttribute('aria-labelledby', 'detail-status-label');
        for (const status of PORTAL_CONFIG.STATUSAR) {
          select.append(new Option(status, status));
        }
        select.value = saved.status ?? '';

        const fieldError = document.createElement('span');
        fieldError.className = 'field-error';
        fieldError.dataset.errorFor = 'status';

        form.append(select, fieldError);
        return { form, select };
      }

      /* ---------- Detalj: övriga fält ---------- */

      function updateListCells(arendenummer, fields) {
        if (arendenummer == null) return;
        const wanted = String(arendenummer);
        const row = [...document.querySelectorAll('#case-list tr[data-arendenummer]')].find(
          (tr) => tr.dataset.arendenummer === wanted,
        );
        if (!row) return;
        for (const [field, value] of Object.entries(fields)) {
          const clip = row.querySelector(`td[data-field="${field}"] .case-clip`);
          if (!clip) continue;
          const text = value == null ? '' : String(value);
          clip.textContent = text;
          if (text) clip.title = text;
          else clip.removeAttribute('title');
        }
      }

      function createEditForm(saved) {
        const form = document.createElement('form');
        form.id = 'detail-edit-form';
        form.className = 'detail-edit-form';

        function addField(name, control) {
          const wrap = document.createElement('div');
          wrap.className = 'detail-edit-field';
          const label = document.createElement('label');
          label.htmlFor = `detail-edit-${name}`;
          label.textContent = LIST_FIELD_LABELS[name] || name;
          control.id = `detail-edit-${name}`;
          control.name = name;
          const fieldError = document.createElement('span');
          fieldError.className = 'field-error';
          fieldError.dataset.errorFor = name;
          wrap.append(label, control, fieldError);
          form.append(wrap);
          return control;
        }

        const rubrik = addField('rubrik', document.createElement('input'));
        rubrik.type = 'text';
        rubrik.value = saved.rubrik;

        const beskrivning = addField('beskrivning', document.createElement('textarea'));
        beskrivning.rows = 5;
        beskrivning.value = saved.beskrivning;

        const kategori = addField('kategori', document.createElement('select'));
        for (const value of PORTAL_CONFIG.KATEGORIER) {
          kategori.append(new Option(value, value));
        }
        kategori.value = saved.kategori;

        const prioritet = addField('prioritet', document.createElement('select'));
        for (const value of PORTAL_CONFIG.PRIORITETER) {
          prioritet.append(new Option(String(value), String(value)));
        }
        prioritet.value = String(saved.prioritet);
        return { form, rubrik, beskrivning, kategori, prioritet };
      }

      function wireSaving(saved, edit, statusForm, select) {
        const requestId = detailRequest;
        const footer = document.getElementById('detail-footer');
        const reset = document.createElement('button');
        reset.type = 'button';
        reset.className = 'detail-edit-submit';
        reset.textContent = 'Återställ';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'detail-status-submit';
        button.textContent = 'Spara';
        footer.append(reset, button);

        let pending = false;

        function isDirty() {
          return select.value !== saved.status || Object.keys(fieldChanges()).length > 0;
        }

        function setBusy(busy) {
          button.disabled = busy || !isDirty();
          reset.disabled = busy;
          button.textContent = busy ? 'Sparar…' : 'Spara';
        }

        function fieldChanges() {
          const changes = {};
          if (edit.rubrik.value !== saved.rubrik) changes.rubrik = edit.rubrik.value;
          if (edit.beskrivning.value !== saved.beskrivning)
            changes.beskrivning = edit.beskrivning.value;
          if (edit.kategori.value !== saved.kategori) changes.kategori = edit.kategori.value;
          const nextPrioritet = Number(edit.prioritet.value);
          if (nextPrioritet !== saved.prioritet) changes.prioritet = nextPrioritet;
          return changes;
        }

        function resetFields() {
          edit.rubrik.value = saved.rubrik;
          edit.beskrivning.value = saved.beskrivning;
          edit.kategori.value = saved.kategori;
          edit.prioritet.value = String(saved.prioritet);
          select.value = saved.status;
          clearFieldErrors(edit.form);
          clearFieldErrors(statusForm);
          clearDetailMessage();
        }

        function showOutcome(statusOk, fieldOk, statusFel, fieldFel) {
          if (statusOk === true && fieldOk === false) {
            showDetailMessage('Statusen är ändrad. Övriga fält kunde inte sparas.');
          } else if (fieldOk === true && statusOk === false) {
            showDetailMessage('Övriga fält är sparade. Statusen kunde inte ändras.');
          } else if (statusOk === false || fieldOk === false) {
            showDetailMessage(fieldFel || statusFel);
          } else if (statusOk === true && fieldOk == null) {
            showDetailMessage('Statusen är ändrad.', 'ok');
            select.focus();
          } else if (fieldOk === true) {
            clearDetailMessage();
          }
        }

        async function saveAll() {
          if (pending) return;
          const changes = fieldChanges();
          const statusChanged = select.value !== saved.status;
          if (!statusChanged && Object.keys(changes).length === 0) return;

          pending = true;
          setBusy(true);
          clearFieldErrors(edit.form);
          clearFieldErrors(statusForm);
          clearDetailMessage();

          const nextStatus = select.value;
          const statusTask = statusChanged
            ? changeStatus(saved.arendenummer, nextStatus)
            : Promise.resolve(null);
          const fieldTask =
            Object.keys(changes).length > 0
              ? api('PATCH', `/api/arenden/${encodeURIComponent(saved.arendenummer)}`, changes)
              : Promise.resolve(null);
          const [statusRes, fieldRes] = await Promise.all([statusTask, fieldTask]);
          if (requestId !== detailRequest) return;

          let statusOk = null;
          let fieldOk = null;
          let statusFel = '';
          let fieldFel = '';

          if (fieldRes) {
            if (fieldRes.ok && isCaseObject(fieldRes.data)) {
              fieldOk = true;
              const data = fieldRes.data;
              if (data.rubrik != null) saved.rubrik = String(data.rubrik);
              if (data.beskrivning != null) saved.beskrivning = String(data.beskrivning);
              if (data.kategori != null) saved.kategori = String(data.kategori);
              if (data.prioritet != null) saved.prioritet = Number(data.prioritet);
              edit.rubrik.value = saved.rubrik;
              edit.beskrivning.value = saved.beskrivning;
              edit.kategori.value = saved.kategori;
              edit.prioritet.value = String(saved.prioritet);
              updateListCells(saved.arendenummer, {
                rubrik: saved.rubrik,
                prioritet: saved.prioritet,
              });
            } else {
              fieldOk = false;
              fieldFel = fieldRes.data?.fel || 'Ärendet kunde inte sparas.';
              if (fieldRes.data?.faltfel && typeof fieldRes.data.faltfel === 'object') {
                showFieldErrors(edit.form, fieldRes.data.faltfel);
              }
            }
          }

          if (statusRes) {
            if (statusRes.ok && isCaseObject(statusRes.data)) {
              statusOk = true;
              const confirmed =
                statusRes.data.status == null || statusRes.data.status === ''
                  ? nextStatus
                  : String(statusRes.data.status);
              saved.status = confirmed;
              select.value = confirmed;
              updateListStatus(saved.arendenummer, confirmed);
            } else {
              statusOk = false;
              statusFel = statusRes.data?.fel || 'Statusen kunde inte ändras.';
              const fieldMessage =
                statusRes.status === 400 ? statusRes.data?.faltfel?.status : null;
              if (fieldMessage) showFieldErrors(statusForm, { status: fieldMessage });
            }
          }

          pending = false;
          setBusy(false);
          showOutcome(statusOk, fieldOk, statusFel, fieldFel);
        }

        function onEnter(event) {
          if (event.key !== 'Enter' || event.target.tagName === 'TEXTAREA') return;
          event.preventDefault();
          saveAll();
        }

        function onDraftChange() {
          if (pending) return;
          setBusy(false);
        }

        reset.addEventListener('click', () => {
          if (pending) return;
          resetFields();
          setBusy(false);
        });
        button.addEventListener('click', () => saveAll());
        edit.form.addEventListener('input', onDraftChange);
        edit.form.addEventListener('change', onDraftChange);
        statusForm.addEventListener('change', onDraftChange);
        edit.form.addEventListener('keydown', onEnter);
        statusForm.addEventListener('keydown', onEnter);
        edit.form.addEventListener('submit', (event) => {
          event.preventDefault();
          saveAll();
        });
        statusForm.addEventListener('submit', (event) => {
          event.preventDefault();
          saveAll();
        });
        setBusy(false);
      }

      /* ---------- Detalj: visning ---------- */

      function caseSnapshot(arende) {
        return {
          arendenummer: arende.arendenummer == null ? '' : String(arende.arendenummer),
          rubrik: arende.rubrik == null ? '' : String(arende.rubrik),
          beskrivning: arende.beskrivning == null ? '' : String(arende.beskrivning),
          kategori: arende.kategori == null ? '' : String(arende.kategori),
          prioritet: Number(arende.prioritet),
          status: arende.status == null ? '' : String(arende.status),
          deadline: arende.deadline == null ? '' : String(arende.deadline),
        };
      }

      function createTextField(name, value) {
        const wrap = document.createElement('div');
        wrap.className = 'detail-text';
        const dt = document.createElement('dt');
        dt.textContent = LIST_FIELD_LABELS[name] || name;
        const dd = document.createElement('dd');
        dd.textContent = value == null ? '' : String(value);
        wrap.append(dt, dd);
        return wrap;
      }

      function renderCaseDetail(container, arende) {
        const saved = caseSnapshot(arende);
        document.getElementById('detail-footer').replaceChildren();

        const stack = document.createElement('div');
        stack.className = 'detail-fields';
        const statusBlock = document.createElement('div');
        statusBlock.className = 'detail-status-block';
        const statusLabel = document.createElement('dt');
        statusLabel.id = 'detail-status-label';
        statusLabel.textContent = LIST_FIELD_LABELS.status;
        const status = createStatusForm(saved);
        statusBlock.append(statusLabel, status.form);
        const edit = createEditForm(saved);

        stack.append(
          createTextField('arendenummer', saved.arendenummer),
          edit.form,
          statusBlock,
          createTextField('skapad', formatCreatedAt(arende.skapad)),
          createTextField('deadline', saved.deadline),
        );
        wireSaving(saved, edit, status.form, status.select);
        container.append(stack);
      }

      async function onShowDetailView(arendenummer) {
        const requestId = ++detailRequest;
        const detail = document.getElementById('view-detail');
        const host = document.getElementById('case-detail');
        detail.hidden = false;
        setDetailScrollLock(true);
        clearGlobalMessage();
        clearDetailMessage();
        detail.querySelector('.detail-close').focus();
        host.replaceChildren();
        document.getElementById('detail-footer').replaceChildren();

        const loading = document.createElement('p');
        loading.className = 'detail-status';
        loading.textContent = 'Hämtar ärende…';
        host.append(loading);

        const res = await api('GET', `/api/arenden/${encodeURIComponent(arendenummer)}`);
        if (requestId !== detailRequest) return;

        host.replaceChildren();
        if (!res.ok || !isCaseObject(res.data)) {
          const error = document.createElement('p');
          error.className = 'detail-error';
          error.textContent = res.data?.fel || 'Kunde inte hämta ärendet.';
          host.append(error);
          return;
        }
        renderCaseDetail(host, res.data);
      }

      /* ================================================================
       START (delat skelett)
       ================================================================ */

      function init() {
        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => showView(btn.dataset.nav));
        });
        initNewCaseView();
        initCaseViews();
        showView('list');
      }

      // Gör hjälpfunktionerna åtkomliga för tester och webbläsarens konsol.
      window.Portal = {
        PORTAL_CONFIG,
        api,
        showView,
        showGlobalMessage,
        clearGlobalMessage,
        showFieldErrors,
        clearFieldErrors,
        formatCreatedAt,
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    </script>
  </body>
</html>
