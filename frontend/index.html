<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kundserviceportalen</title>
    <style>
      /* ===== DELAT SKELETT: grundstil. Del 3 och Del 4 lägger egen CSS under sina markeringar längst ner. ===== */
      :root {
        --bg: #f3f5f7;
        --surface: #ffffff;
        --text: #1b2733;
        --muted: #5b6b79;
        --border: #d3dae0;
        --accent: #1d5fa8;
        --error: #b42318;
        --ok: #1a7f4b;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--text);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        line-height: 1.5;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 2rem;
        padding: 0.75rem 1.5rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .topbar h1 {
        margin: 0;
        font-size: 1.15rem;
      }
      nav {
        display: flex;
        gap: 0.5rem;
      }
      nav button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      nav button[aria-current='page'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (max-width: 40rem) {
        .topbar {
          flex-wrap: wrap;
          gap: 0.75rem;
          padding: 0.75rem 1rem;
        }
        nav {
          flex-wrap: wrap;
        }
        nav button {
          white-space: nowrap;
        }
      }
      main {
        max-width: 60rem;
        margin: 1.5rem auto;
        padding: 0 1.5rem;
      }
      section[data-view] {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
      }
      section[data-view][hidden] {
        display: none;
      }
      h2 {
        margin-top: 0;
        font-size: 1.1rem;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .field-error {
        display: block;
        min-height: 1.25rem;
        color: var(--error);
        font-size: 0.9rem;
      }
      [aria-invalid='true'] {
        border-color: var(--error);
      }
      #global-message {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--error);
        background: #fdecea;
        color: var(--error);
      }
      #global-message[data-kind='ok'] {
        border-color: var(--ok);
        background: #e8f5ee;
        color: var(--ok);
      }
      #global-message[hidden] {
        display: none;
      }
      .placeholder {
        margin: 0;
        padding: 1rem;
        border: 2px dashed var(--border);
        border-radius: 6px;
        color: var(--muted);
      }

      /* ===== DEL 3 – CSS för registreringsformuläret: lägg till här ===== */

      /* ===== DEL 4 – CSS för lista, detalj, status och redigering: lägg till här ===== */
      .case-table-wrap {
        overflow-x: hidden;
      }
      .case-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      .case-table th,
      .case-table td {
        text-align: left;
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      .case-table th {
        font-weight: 600;
        color: var(--muted);
      }
      .case-table th[data-field='arendenummer'],
      .case-table td[data-field='arendenummer'] {
        width: 18%;
      }
      .case-table th[data-field='prioritet'],
      .case-table td[data-field='prioritet'] {
        width: 12%;
      }
      .case-table th[data-field='status'],
      .case-table td[data-field='status'] {
        width: 18%;
      }
      .case-table th[data-field='deadline'],
      .case-table td[data-field='deadline'] {
        width: 18%;
      }
      .case-clip {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .case-table td[data-field='rubrik'] .case-clip {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .case-list-empty {
        margin: 0;
        color: var(--muted);
      }
      .case-row {
        cursor: pointer;
      }
      .case-row:hover {
        background: #f7f9fb;
      }
      .case-row:focus,
      .case-row.is-focused {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      .case-row:focus td,
      .case-row.is-focused td {
        background: #e7f0fa;
      }
      @media (max-width: 40rem) {
        #view-list {
          padding: 1rem 1rem 0.35rem;
        }
        .case-table,
        .case-table tbody,
        .case-table tr,
        .case-table td {
          display: block;
          width: auto;
        }
        .case-table thead {
          display: none;
        }
        .case-table th[data-field],
        .case-table td[data-field] {
          width: auto;
        }
        .case-table tr.case-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-areas:
            'rubrik rubrik'
            'nummer status'
            'prio deadline';
          column-gap: 0.75rem;
          row-gap: 0.15rem;
          margin: 0.2rem 0.15rem;
          padding: 0.8rem 0.9rem;
          border: 0;
          border-bottom: 1px solid var(--border);
          border-radius: 0;
        }
        .case-table tr.case-row:last-child {
          border-bottom: 0;
        }
        .case-table tr.case-row:hover {
          background: #f7f9fb;
          border-radius: 8px;
        }
        .case-row:focus td,
        .case-row.is-focused td {
          background: transparent;
        }
        .case-row:focus,
        .case-row.is-focused {
          background: #e7f0fa;
          border-radius: 8px;
        }
        .case-table td {
          border: 0;
          padding: 0;
          min-width: 0;
        }
        .case-table td::before {
          content: none;
        }
        .case-table td[data-field='rubrik'] {
          grid-area: rubrik;
          color: var(--text);
          font-weight: 600;
          font-size: 1rem;
          line-height: 1.35;
        }
        .case-table td[data-field='arendenummer'] {
          grid-area: nummer;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td[data-field='status'] {
          grid-area: status;
          justify-self: end;
          align-self: center;
        }
        .case-table td[data-field='status'] .case-clip {
          display: inline-block;
          padding: 0.08rem 0.5rem;
          border-radius: 999px;
          background: #e8eef5;
          color: var(--text);
          font-size: 0.75rem;
          font-weight: 600;
          line-height: 1.45;
        }
        .case-table td[data-field='prioritet'] {
          grid-area: prio;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td[data-field='prioritet']::before {
          content: 'Prio ';
        }
        .case-table td[data-field='deadline'] {
          grid-area: deadline;
          justify-self: end;
          color: var(--muted);
          font-size: 0.82rem;
        }
        .case-table td .case-clip {
          display: inline;
          min-width: 0;
          overflow: visible;
          overflow-wrap: normal;
          -webkit-line-clamp: unset;
          line-clamp: unset;
        }
        .case-table td[data-field='rubrik'] .case-clip {
          display: -webkit-box;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          overflow: hidden;
        }
      }
      @media (min-width: 40.0625rem) and (max-width: 52rem) {
        .case-table th,
        .case-table td {
          padding: 0.5rem 0.45rem;
          overflow: hidden;
        }
        .case-table th {
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        .case-table th[data-field='arendenummer'],
        .case-table td[data-field='arendenummer'] {
          width: 9.25rem;
        }
        .case-table th[data-field='prioritet'],
        .case-table td[data-field='prioritet'] {
          width: 4.75rem;
        }
        .case-table th[data-field='status'],
        .case-table td[data-field='status'] {
          width: 6.5rem;
        }
        .case-table th[data-field='deadline'],
        .case-table td[data-field='deadline'] {
          width: 6.75rem;
        }
      }
      html.detail-open,
      body.detail-open {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #view-detail:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0.75rem;
        border: 0;
        border-radius: 0;
        background: rgba(27, 39, 51, 0.45);
        overflow: hidden;
      }
      .detail-dialog {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: min(40rem, 100%);
        max-height: 100%;
        min-height: 0;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1.5rem;
        box-shadow: 0 12px 40px rgba(27, 39, 51, 0.18);
      }
      .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        flex: 0 0 auto;
      }
      .detail-close {
        flex: 0 0 auto;
        width: 2.75rem;
        height: 2.75rem;
        margin: -0.4rem -0.4rem 0 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      .detail-close:hover {
        background: #f7f9fb;
      }
      .detail-body {
        min-height: 0;
        /* Luft så att fokusringen runt dropdownen inte klipps av scrollytan. */
        margin-left: -0.5rem;
        margin-right: -0.5rem;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .detail-fields {
        display: grid;
        grid-template-columns: minmax(7.5rem, 11rem) minmax(0, 1fr);
        gap: 0.65rem 1rem;
        margin: 0;
      }
      .detail-fields dt {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
      }
      .detail-fields dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .detail-status,
      .detail-error {
        margin: 0;
      }
      .detail-error {
        color: var(--error);
      }
      .detail-message {
        flex: 0 0 auto;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--error);
        background: #fdecea;
        color: var(--error);
      }
      .detail-message[data-kind='ok'] {
        border-color: var(--ok);
        background: #e8f5ee;
        color: var(--ok);
      }
      .detail-message[hidden] {
        display: none;
      }
      .detail-status-form {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .detail-status-form select,
      .detail-edit-form select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 2rem 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--surface);
        /* Egen nedåtpil av två gradienter, så att den följer --text och får jämnt avstånd till kanten. */
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text) 50%),
          linear-gradient(135deg, var(--text) 50%, transparent 50%);
        background-repeat: no-repeat;
        background-position:
          calc(100% - 1.5rem) 50%,
          calc(100% - 1rem) 50%;
        background-size: 0.5rem 0.5rem;
        color: var(--text);
        font: inherit;
      }
      .detail-footer {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }
      .detail-footer:empty {
        display: none;
      }
      .detail-status-submit {
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .detail-status-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .detail-edit-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
        margin-top: 1.5rem;
      }
      .detail-edit-form h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }
      .detail-edit-field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 0;
      }
      .detail-edit-field label {
        font-weight: 600;
      }
      .detail-edit-form input,
      .detail-edit-form textarea {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        overflow-wrap: anywhere;
      }
      .detail-edit-submit {
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .detail-edit-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      @media (max-width: 40rem) {
        #view-detail:not([hidden]) {
          padding: 0.5rem;
        }
        .detail-dialog {
          padding: 1rem;
        }
        .detail-fields {
          grid-template-columns: 1fr;
          gap: 0.15rem 0;
        }
        .detail-fields dd {
          margin-bottom: 0.75rem;
        }
        .detail-footer {
          flex-direction: column;
        }
        .detail-footer .detail-status-submit,
        .detail-footer .detail-edit-submit {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Kundserviceportalen</h1>
      <nav aria-label="Huvudmeny">
        <button type="button" data-nav="list">Ärenden</button>
        <button type="button" data-nav="new">Nytt ärende</button>
      </nav>
    </header>

    <main>
      <div id="global-message" role="alert" hidden></div>

      <!-- ===== DEL 3: Registrera ärende (AK1–AK8) ===== -->
      <section id="view-new" data-view="new" aria-labelledby="h-new" hidden>
        <h2 id="h-new">Registrera nytt ärende</h2>
        <p class="placeholder">Inte byggt ännu. Ägs av Del 3 (formulär för AK1–AK8).</p>
        <!--
        Kontrakt för formuläret:
          - fältnamn (name=…): rubrik, beskrivning, kategori, prioritet, status, deadline
          - vid varje fält ett <span class="field-error" data-error-for="<fältnamn>"></span>
            som showFieldErrors() fyller med serverns meddelande
          - skicka med api('POST', '/api/arenden', data)
      --></section>

      <!-- ===== DEL 4: Lista (AK10) ===== -->
      <section id="view-list" data-view="list" aria-labelledby="h-list">
        <h2 id="h-list">Ärenden</h2>
        <div id="case-list"></div>
      </section>

      <!-- ===== DEL 4: Detalj, ändra status och redigera (AK11–AK16) ===== -->
      <section id="view-detail" data-view="detail" hidden>
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="h-detail">
          <div class="detail-header">
            <h2 id="h-detail">Ärende</h2>
            <button type="button" class="detail-close" aria-label="Stäng">×</button>
          </div>
          <p id="detail-message" class="detail-message" role="status" hidden></p>
          <div id="case-detail" class="detail-body"></div>
          <div id="detail-footer" class="detail-footer"></div>
        </div>
      </section>
    </main>

    <script>
      'use strict';

      /* ================================================================
       DELAT SKELETT – ändras bara via en liten, granskad PR.
       Funktioner som alla delar använder: api(), showView(), showFieldErrors(), formatCreatedAt().
       ================================================================ */

      // Samma värden som backend/src/constants.js. Risk: listorna kan glida isär –
      // ett test som jämför dem vore en bra liten uppgift.
      const PORTAL_CONFIG = Object.freeze({
        KATEGORIER: [
          'Anmälan och inskrivning',
          'Aktivitetsrapport',
          'Ersättning och stöd',
          'Jobb och sökning',
          'Utbildning och insatser',
          'Digital tjänst och inloggning',
          'Övrigt',
        ],
        STATUSAR: ['Nytt', 'Pågående', 'Väntar på kund', 'Avslutat'],
        PRIORITETER: [1, 2, 3, 4, 5],
        RUBRIK_MAX: 100,
        BESKRIVNING_MAX: 5000,
      });

      /**
       * Anropar backend. Kastar aldrig – fel kommer tillbaka som { ok:false, status, data }.
       * data.fel = allmänt meddelande, data.faltfel = { fältnamn: meddelande } (se docs/API.md).
       */
      async function api(method, path, body) {
        try {
          const res = await fetch(path, {
            method,
            headers: body === undefined ? undefined : { 'Content-Type': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          let data = null;
          try {
            data = await res.json();
          } catch {
            /* svaret var inte JSON */
          }
          return { ok: res.ok, status: res.status, data };
        } catch {
          return {
            ok: false,
            status: 0,
            data: {
              fel: 'Kunde inte nå servern. Kontrollera att den är igång.',
            },
          };
        }
      }

      function showView(name, arg) {
        document.querySelectorAll('[data-view]').forEach((el) => {
          el.hidden = el.dataset.view !== name;
        });
        document.querySelectorAll('[data-nav]').forEach((btn) => {
          // "detail" hör till menyvalet Ärenden
          const active = btn.dataset.nav === (name === 'detail' ? 'list' : name);
          if (active) btn.setAttribute('aria-current', 'page');
          else btn.removeAttribute('aria-current');
        });
        clearGlobalMessage();
        if (name === 'new') onShowNewView();
        if (name === 'list') onShowListView();
        if (name === 'detail') onShowDetailView(arg);
      }

      function showGlobalMessage(text, kind = 'error') {
        const el = document.getElementById('global-message');
        el.textContent = text;
        el.dataset.kind = kind;
        el.hidden = false;
      }
      function clearGlobalMessage() {
        const el = document.getElementById('global-message');
        el.hidden = true;
        el.textContent = '';
      }

      /** Skriver ut fältfel intill rätt fält: <span data-error-for="rubrik"> + aria-invalid på [name="rubrik"]. */
      function showFieldErrors(form, faltfel = {}) {
        clearFieldErrors(form);
        for (const [falt, meddelande] of Object.entries(faltfel)) {
          const out = form.querySelector(`[data-error-for="${falt}"]`);
          const input = form.querySelector(`[name="${falt}"]`);
          if (out) out.textContent = meddelande;
          if (input) input.setAttribute('aria-invalid', 'true');
        }
      }
      function clearFieldErrors(form) {
        form.querySelectorAll('[data-error-for]').forEach((el) => {
          el.textContent = '';
        });
        form.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
      }

      /** Visar skapad (ISO 8601, UTC) i svensk lokal tid, t.ex. 2026-11-03 11:00. */
      function formatCreatedAt(value) {
        if (value == null || value === '') return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return new Intl.DateTimeFormat('sv-SE', {
          timeZone: 'Europe/Stockholm',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        }).format(date);
      }

      /* ================================================================
       DEL 3 – Registrera ärende (AK1–AK8)
       Ägare: se docs/ARBETSFORDELNING.md. Rör bara det här blocket.
       ================================================================ */

      function initNewCaseView() {
        // TODO Del 3: bygg formuläret, koppla "Registrera" till api('POST', '/api/arenden', …),
        //             visa showFieldErrors(form, res.data.faltfel) vid fel och bekräftelse vid lyckat svar.
      }
      function onShowNewView() {
        // TODO Del 3: nollställ formuläret när vyn visas.
      }

      /* ================================================================
       DEL 4 – Lista, detalj, status och redigering (AK10–AK16)
       Ägare: se docs/ARBETSFORDELNING.md. Rör bara det här blocket.
       ================================================================ */

      const LIST_FIELD_LABELS = {
        arendenummer: 'Ärendenummer',
        rubrik: 'Rubrik',
        beskrivning: 'Beskrivning',
        kategori: 'Kategori',
        prioritet: 'Prioritet',
        status: 'Status',
        skapad: 'Skapad',
        deadline: 'Deadline',
      };
      const DEFAULT_LIST_FIELDS = ['arendenummer', 'rubrik', 'prioritet', 'status', 'deadline'];
      const DETAIL_FIELDS = [
        'arendenummer',
        'rubrik',
        'beskrivning',
        'kategori',
        'prioritet',
        'status',
        'skapad',
        'deadline',
      ];

      let detailRequest = 0;
      let detailTrigger = null;

      /* ---------- Lista ---------- */

      function setDetailScrollLock(locked) {
        document.documentElement.classList.toggle('detail-open', locked);
        document.body.classList.toggle('detail-open', locked);
      }

      function focusCaseRow(row) {
        if (!row || !row.isConnected) return;
        document.querySelectorAll('#case-list .case-row.is-focused').forEach((el) => {
          if (el !== row) el.classList.remove('is-focused');
        });
        row.classList.add('is-focused');
        try {
          row.focus({ focusVisible: true });
        } catch {
          row.focus();
        }
      }

      function closeDetailView() {
        detailRequest += 1;
        const trigger = detailTrigger;
        detailTrigger = null;
        // Stäng-knappen försvinner vid musklick. Fokus sätts på raden innan dess,
        // och en gång till efteråt så att webbläsaren inte lämnar fokus på sidan.
        focusCaseRow(trigger);
        document.getElementById('view-detail').hidden = true;
        setDetailScrollLock(false);
        setTimeout(() => focusCaseRow(trigger), 0);
      }

      function openCaseFromRow(row) {
        detailTrigger = row;
        onShowDetailView(row.dataset.arendenummer);
      }

      function initCaseViews() {
        const list = document.getElementById('case-list');
        list.addEventListener('click', (event) => {
          const row = event.target.closest('tr[data-arendenummer]');
          if (!row) return;
          openCaseFromRow(row);
        });
        list.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          const row = event.target.closest('tr[data-arendenummer]');
          if (!row) return;
          event.preventDefault();
          openCaseFromRow(row);
        });
        list.addEventListener('focusin', (event) => {
          const row = event.target.closest('tr.case-row');
          if (!row) return;
          document.querySelectorAll('#case-list .case-row.is-focused').forEach((el) => {
            if (el !== row) el.classList.remove('is-focused');
          });
          row.classList.add('is-focused');
        });

        const detail = document.getElementById('view-detail');
        detail.addEventListener('click', (event) => {
          if (event.target.closest('.detail-dialog')) return;
          closeDetailView();
        });
        detail.querySelector('.detail-close').addEventListener('click', (event) => {
          event.stopPropagation();
          closeDetailView();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          if (detail.hidden) return;
          event.preventDefault();
          closeDetailView();
        });

        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => setDetailScrollLock(false));
        });
      }

      async function onShowListView() {
        setDetailScrollLock(false);

        const container = document.getElementById('case-list');
        container.replaceChildren();

        const res = await api('GET', '/api/arenden');
        if (!res.ok || !Array.isArray(res.data)) {
          showGlobalMessage(res.data?.fel || 'Kunde inte hämta ärenden.');
          return;
        }

        if (res.data.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'case-list-empty';
          empty.textContent = 'Inga ärenden ännu.';
          container.append(empty);
          return;
        }

        renderCaseTable(container, res.data, DEFAULT_LIST_FIELDS);
      }

      function renderCaseTable(container, cases, fields) {
        const wrap = document.createElement('div');
        wrap.className = 'case-table-wrap';
        const table = document.createElement('table');
        table.className = 'case-table';

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        for (const field of fields) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.dataset.field = field;
          th.textContent = LIST_FIELD_LABELS[field] || field;
          headRow.append(th);
        }
        thead.append(headRow);

        const tbody = document.createElement('tbody');
        for (const arende of cases) {
          const tr = document.createElement('tr');
          if (arende.arendenummer != null) {
            tr.dataset.arendenummer = String(arende.arendenummer);
            tr.classList.add('case-row');
            tr.tabIndex = 0;
          }
          for (const field of fields) {
            const td = document.createElement('td');
            const value = arende[field];
            const text = value == null ? '' : String(value);
            td.dataset.field = field;
            td.dataset.label = LIST_FIELD_LABELS[field] || field;
            const clip = document.createElement('span');
            clip.className = 'case-clip';
            clip.textContent = text;
            if (text) clip.title = text;
            td.append(clip);
            tr.append(td);
          }
          tbody.append(tr);
        }

        table.append(thead, tbody);
        wrap.append(table);
        container.append(wrap);
      }

      function updateListRow(arende) {
        if (arende?.arendenummer == null) return;
        const wanted = String(arende.arendenummer);
        const row = [...document.querySelectorAll('#case-list tr[data-arendenummer]')].find(
          (tr) => tr.dataset.arendenummer === wanted,
        );
        if (!row) return;
        for (const cell of row.querySelectorAll('td[data-field]')) {
          const clip = cell.querySelector('.case-clip');
          if (!clip) continue;
          const value = arende[cell.dataset.field];
          const text = value == null ? '' : String(value);
          clip.textContent = text;
          if (text) clip.title = text;
          else clip.removeAttribute('title');
        }
      }

      /* ---------- Detalj: meddelanden ---------- */

      function showDetailMessage(text, kind = 'error') {
        const el = document.getElementById('detail-message');
        el.textContent = text;
        el.dataset.kind = kind;
        el.hidden = false;
      }

      function clearDetailMessage() {
        const el = document.getElementById('detail-message');
        el.hidden = true;
        el.textContent = '';
        delete el.dataset.kind;
      }

      /* ---------- Detalj: statusbyte ---------- */

      function isCaseObject(data) {
        return data != null && typeof data === 'object' && !Array.isArray(data);
      }

      // Spara är inaktiv medan något sparas och så länge vald status är samma som den sparade.
      function updateStatusControls({ select, button, confirmedStatus }, busy) {
        select.disabled = busy;
        button.disabled = busy || select.value === confirmedStatus;
        button.textContent = busy ? 'Sparar…' : 'Spara';
      }

      function changeStatus(arendenummer, status) {
        return api('PATCH', `/api/arenden/${encodeURIComponent(arendenummer)}/status`, { status });
      }

      // Fältfel vid statusfältet när servern skickar ett. data.fel visas alltid överst.
      function showStatusError(form, res) {
        const fieldMessage = res.status === 400 ? res.data?.faltfel?.status : null;
        if (fieldMessage) showFieldErrors(form, { status: fieldMessage });
        showDetailMessage(res.data?.fel || 'Statusen kunde inte ändras.');
      }

      // Körs när servern har bekräftat ändringen: lista och detalj visar bara serverns svar.
      function showUpdatedCase(arende) {
        updateListRow(arende);
        const host = document.getElementById('case-detail');
        host.replaceChildren();
        renderCaseDetail(host, arende);
        showDetailMessage('Statusen är ändrad.', 'ok');
        document.getElementById('detail-status')?.focus(); // detaljen ritades om, så fokus måste sättas tillbaka
      }

      function createStatusForm(arende, onSaved) {
        const requestId = detailRequest; // ignorera svar om detaljvyn hunnit stängas eller bytas
        const confirmedStatus = arende.status ?? '';

        const form = document.createElement('form');
        form.id = 'detail-status-form';
        form.className = 'detail-status-form';

        const select = document.createElement('select');
        select.id = 'detail-status';
        select.name = 'status';
        select.setAttribute('aria-labelledby', 'detail-status-label');
        for (const status of PORTAL_CONFIG.STATUSAR) {
          select.append(new Option(status, status));
        }
        select.value = confirmedStatus;

        const fieldError = document.createElement('span');
        fieldError.className = 'field-error';
        fieldError.dataset.errorFor = 'status';

        form.append(select, fieldError);

        // Spara-knappen ligger längst ner i dialogen (utanför det scrollande innehållet)
        // och hör till formuläret via form-attributet.
        const button = document.createElement('button');
        button.type = 'submit';
        button.className = 'detail-status-submit';
        button.setAttribute('form', form.id);
        document.getElementById('detail-footer').replaceChildren(button);

        const controls = { select, button, confirmedStatus };
        let pending = false;
        updateStatusControls(controls, false); // Spara är inaktiv tills en annan status är vald
        select.addEventListener('change', () => updateStatusControls(controls, false));

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (pending) return;
          const nextStatus = select.value;
          if (nextStatus === confirmedStatus) return;

          pending = true;
          updateStatusControls(controls, true);
          clearFieldErrors(form);
          clearDetailMessage();

          const res = await changeStatus(arende.arendenummer, nextStatus);
          if (requestId !== detailRequest) return;

          if (res.ok && isCaseObject(res.data)) {
            onSaved(res.data);
            return;
          }
          pending = false;
          select.value = confirmedStatus; // visa aldrig en status som servern inte har bekräftat
          updateStatusControls(controls, false);
          select.focus();
          showStatusError(form, res);
        });

        return form;
      }

      /* ---------- Detalj: övriga fält ---------- */

      function showSavedFields(arende) {
        updateListRow(arende);
        const host = document.getElementById('case-detail');
        host.replaceChildren();
        renderCaseDetail(host, arende);
        clearGlobalMessage();
        clearDetailMessage();
      }

      function createEditForm(arende) {
        const requestId = detailRequest;
        const saved = {
          rubrik: arende.rubrik == null ? '' : String(arende.rubrik),
          beskrivning: arende.beskrivning == null ? '' : String(arende.beskrivning),
          kategori: arende.kategori == null ? '' : String(arende.kategori),
          prioritet: Number(arende.prioritet),
        };

        const form = document.createElement('form');
        form.id = 'detail-edit-form';
        form.className = 'detail-edit-form';

        const heading = document.createElement('h3');
        heading.textContent = 'Redigera ärende';
        form.append(heading);

        function addField(name, control) {
          const wrap = document.createElement('div');
          wrap.className = 'detail-edit-field';
          const label = document.createElement('label');
          label.htmlFor = `detail-edit-${name}`;
          label.textContent = LIST_FIELD_LABELS[name] || name;
          control.id = `detail-edit-${name}`;
          control.name = name;
          const fieldError = document.createElement('span');
          fieldError.className = 'field-error';
          fieldError.dataset.errorFor = name;
          wrap.append(label, control, fieldError);
          form.append(wrap);
          return control;
        }

        const rubrik = addField('rubrik', document.createElement('input'));
        rubrik.type = 'text';
        rubrik.value = saved.rubrik;

        const beskrivning = addField('beskrivning', document.createElement('textarea'));
        beskrivning.rows = 5;
        beskrivning.value = saved.beskrivning;

        const kategori = addField('kategori', document.createElement('select'));
        for (const value of PORTAL_CONFIG.KATEGORIER) {
          kategori.append(new Option(value, value));
        }
        kategori.value = saved.kategori;

        const prioritet = addField('prioritet', document.createElement('select'));
        for (const value of PORTAL_CONFIG.PRIORITETER) {
          prioritet.append(new Option(String(value), String(value)));
        }
        prioritet.value = String(saved.prioritet);

        const button = document.createElement('button');
        button.type = 'submit';
        button.className = 'detail-edit-submit';
        button.textContent = 'Spara ändringar';
        button.setAttribute('form', form.id);
        document
          .getElementById('detail-footer')
          .insertBefore(button, document.getElementById('detail-footer').firstChild);

        let pending = false;

        function setEditBusy(busy) {
          button.disabled = busy;
          button.textContent = busy ? 'Sparar…' : 'Spara ändringar';
        }

        function showEditProblem(text) {
          showDetailMessage(text);
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (pending) return;

          const changes = {};
          if (rubrik.value !== saved.rubrik) changes.rubrik = rubrik.value;
          if (beskrivning.value !== saved.beskrivning) changes.beskrivning = beskrivning.value;
          if (kategori.value !== saved.kategori) changes.kategori = kategori.value;
          const nextPrioritet = Number(prioritet.value);
          if (nextPrioritet !== saved.prioritet) changes.prioritet = nextPrioritet;
          if (Object.keys(changes).length === 0) return;

          pending = true;
          setEditBusy(true);
          clearFieldErrors(form);
          clearDetailMessage();

          const res = await api(
            'PATCH',
            `/api/arenden/${encodeURIComponent(arende.arendenummer)}`,
            changes,
          );
          if (requestId !== detailRequest) return;

          if (res.ok && isCaseObject(res.data)) {
            showSavedFields(res.data);
            return;
          }

          pending = false;
          setEditBusy(false);
          if (res.data?.faltfel && typeof res.data.faltfel === 'object') {
            showFieldErrors(form, res.data.faltfel);
          }
          showEditProblem(res.data?.fel || 'Ärendet kunde inte sparas.');
        });

        return form;
      }

      /* ---------- Detalj: visning ---------- */

      function renderCaseDetail(container, arende) {
        const dl = document.createElement('dl');
        dl.className = 'detail-fields';
        for (const field of DETAIL_FIELDS) {
          const dt = document.createElement('dt');
          dt.textContent = LIST_FIELD_LABELS[field] || field;
          const dd = document.createElement('dd');
          if (field === 'status') {
            dt.id = 'detail-status-label';
            dd.append(createStatusForm(arende, showUpdatedCase));
          } else {
            const value = arende[field];
            dd.textContent =
              field === 'skapad' ? formatCreatedAt(value) : value == null ? '' : String(value);
          }
          dl.append(dt, dd);
        }
        container.append(dl, createEditForm(arende));
      }

      async function onShowDetailView(arendenummer) {
        const requestId = ++detailRequest;
        const detail = document.getElementById('view-detail');
        const host = document.getElementById('case-detail');
        detail.hidden = false;
        setDetailScrollLock(true);
        clearGlobalMessage();
        clearDetailMessage();
        detail.querySelector('.detail-close').focus();
        host.replaceChildren();
        document.getElementById('detail-footer').replaceChildren();

        const loading = document.createElement('p');
        loading.className = 'detail-status';
        loading.textContent = 'Hämtar ärende…';
        host.append(loading);

        const res = await api('GET', `/api/arenden/${encodeURIComponent(arendenummer)}`);
        if (requestId !== detailRequest) return;

        host.replaceChildren();
        if (!res.ok || !isCaseObject(res.data)) {
          const error = document.createElement('p');
          error.className = 'detail-error';
          error.textContent = res.data?.fel || 'Kunde inte hämta ärendet.';
          host.append(error);
          return;
        }
        renderCaseDetail(host, res.data);
      }

      /* ================================================================
       START (delat skelett)
       ================================================================ */

      function init() {
        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => showView(btn.dataset.nav));
        });
        initNewCaseView();
        initCaseViews();
        showView('list');
      }

      // Gör hjälpfunktionerna åtkomliga för tester och webbläsarens konsol.
      window.Portal = {
        PORTAL_CONFIG,
        api,
        showView,
        showGlobalMessage,
        clearGlobalMessage,
        showFieldErrors,
        clearFieldErrors,
        formatCreatedAt,
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    </script>
  </body>
</html>
