      - generic [ref=e58]:
        - generic [ref=e59]: About Myntro
        - generic [ref=e60]: Myntro, old Alektum Group, is a European financial institution with more than 30 years of experience helping to build a more sustainable financial system across Europe. We specialise in investing in non-performing loans and managing debt portfolios, supported by deposit-funded savings products. Founded in Sweden and headquartered in Gothenburg, Myntro operates across 10 markets with a team of approximately 500 employees. We work closely with banks, businesses and individuals to release capital, strengthen cash flows and help people regain control of their financial lives. Responsible debt management is central to our approach. By combining deep expertise with a strong values-driven culture, we aim to reduce the risk of over-indebtedness and contribute to a healthier economy - one where individuals can maintain balanced personal finances and businesses can rely on being paid. Myntro generates annual revenues of approximately EUR 250 million and operates as a regulated credit market institution with SDR status under the supervision of the Swedish Financial Supervisory Authority.
