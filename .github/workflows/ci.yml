name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run pytest with an isolated MySQL test database
        shell: bash
        run: |
          export MYSQL_TEST_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_TEST_PASSWORD="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$MYSQL_TEST_ROOT_PASSWORD" "$MYSQL_TEST_PASSWORD"

          docker compose --env-file .env.example --profile test up --wait --wait-timeout 120 mysql-test

          export TEST_DATABASE_URL="mysql+pymysql://kundportal_test:${MYSQL_TEST_PASSWORD}@127.0.0.1:3307/kundportal_test"
          cd backend
          python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Run type checking and build
        run: npm run build
