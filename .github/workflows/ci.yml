name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright 1.64 may not support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
