name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright 1.64 may not support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium (retries if a download hangs)
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Attempt $attempt failed or timed out, retrying in 20 s"
            sleep 20
          done
          exit 1
      - run: npm run test:e2e
